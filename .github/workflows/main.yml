name: Daily AQI Map Generator

on:
  schedule:
    - cron: '30 21 * * *' # 3:00 AM IST daily (UTC 21:30)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout ML Backend
      - name: Checkout ML Backend
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Generate AQI maps
      - name: Run AQI map generation script
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          python -m scripts.run_pipeline

      # 5. Push generated maps to frontend repository
      - name: Push static maps to Frontend Repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e

          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/adityaB-code100/Hyperlocal-AQI-API-Gateway.git" \
            frontend-repo

          rm -f frontend-repo/static/map*.html

          cp generated/maps/map*.html frontend-repo/static/

          cd frontend-repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add static/

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update AQI static map (daily)"
            git push \
              "https://x-access-token:${GH_TOKEN}@github.com/adityaB-code100/Hyperlocal-AQI-API-Gateway.git" \
              HEAD:main
          else
            echo "No changes to commit."
          fi
```
